<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>adbperfetto</title>
<link rel="icon" href="data:,">
<script>
(function () {
  try {
    var t = localStorage.getItem("adbperfetto.theme");
    if (t !== "light" && t !== "dark") {
      t = (window.matchMedia &&
           window.matchMedia("(prefers-color-scheme: light)").matches)
          ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<header id="topbar">
  <div class="brand">adbperfetto</div>
  <nav class="view-tabs">
    <button class="topbar-btn active" data-view="capture"
            data-i18n="tab.capture">Capture</button>
    <button class="topbar-btn" data-view="configs"
            data-i18n="tab.configs">Configs</button>
  </nav>
  <div class="spacer"></div>
  <div class="outdir">
    <span id="out-path-label" class="field-label"></span>
    <span id="out-path" class="outdir-path"></span>
    <button id="btn-open-dir" class="btn quiet small"
            data-i18n="topbar.open">Open</button>
    <button id="btn-change-dir" class="btn quiet small"
            data-i18n="topbar.change">Change</button>
  </div>
  <button id="btn-theme" class="topbar-btn icon-btn"
          aria-label="Theme"></button>
  <div class="lang-toggle" role="group" aria-label="Language">
    <button id="lang-zh" class="lang-btn active">中</button>
    <span class="lang-sep" aria-hidden="true">|</span>
    <button id="lang-en" class="lang-btn">EN</button>
  </div>
  <span id="conn-dot" class="conn-dot" aria-hidden="true"></span>
  <button id="btn-quit" class="btn quiet small"
          data-i18n="topbar.quit">Quit</button>
</header>

<main>
  <section id="view-capture" class="view active">
    <div id="capture-wrap" class="capture-wrap">
      <aside id="device-rail" class="rail"></aside>
      <div id="capture-main" class="panel"></div>
    </div>
  </section>

  <section id="view-configs" class="view">
    <div id="configs-wrap" class="configs-wrap">
      <aside class="preset-col">
        <div class="preset-head" data-i18n="tab.configs">Configs</div>
        <div id="preset-list" class="preset-list"></div>
        <button id="btn-import" class="btn quiet small preset-import"
                data-i18n="cfg.import">Import file</button>
        <input type="file" id="import-file" class="hidden"
               accept=".pbtx,.conf,.txt,.cfg">
      </aside>
      <div class="editor-col">
        <div class="editor-toolbar">
          <input type="text" id="cfg-name" aria-label="Preset name">
          <span id="edited-mark" class="edited-mark hidden"></span>
          <div id="status-pills" class="status-pills"></div>
          <div class="spacer"></div>
          <button id="btn-apply-default" class="btn quiet small"
                  data-i18n="btn.applyDefault">Use in Capture</button>
          <button id="btn-save-preset" class="btn quiet small"
                  data-i18n="cfg.saveAs">Save as preset</button>
        </div>
        <div id="parse-note" class="parse-note hidden"></div>
        <div id="pbtx-editor" class="editor-host"></div>
      </div>
      <div id="builder" class="builder-col"></div>
    </div>
  </section>
</main>

<div id="modal-overlay" class="modal-overlay"></div>
<div id="toast" class="toast" role="status"></div>
<div id="quit-overlay" class="quit-overlay hidden">
  <div class="quit-text">adbperfetto</div>
</div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
